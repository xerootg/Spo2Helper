name: Android APKs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            platforms;android-36-ext19
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Create throwaway keystore (no signing secrets configured)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass android -keypass android \
            -alias ci -dname "CN=Spo2Helper CI" -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ci.jks"
            echo "KEYSTORE_PASSWORD=android"
            echo "KEY_ALIAS=ci"
            echo "KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :wear:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :mobile:lintDebug :wear:lintDebug --no-daemon

      - name: Build APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          cp mobile/build/outputs/apk/release/*.apk out/
          cp wear/build/outputs/apk/release/*.apk out/
          cd out && for f in *.apk; do mv "$f" "spo2helper-${f}"; done && ls -la

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: spo2helper-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            mobile/build/reports/lint-results-debug.html
            wear/build/reports/lint-results-debug.html
            wear/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spo2helper-apks
          path: out
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
