plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.flyfish233.spo2helper.shared'
    compileSdk 36
    compileSdkExtension 19

    defaultConfig {
        minSdk 34
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    api 'androidx.health.connect:connect-client:1.2.0-alpha03'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    api 'com.google.android.gms:play-services-wearable:19.0.0'
}
